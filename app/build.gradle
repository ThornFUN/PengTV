plugins {
    id "com.android.application"
}

def pengStorePassword = providers.gradleProperty("PENG_STORE_PASSWORD").orNull
def pengKeyPassword = providers.gradleProperty("PENG_KEY_PASSWORD")
        .getOrElse(pengStorePassword == null ? "" : pengStorePassword)

android {
    namespace "com.penglauncher.recovered"
    compileSdk 35

    defaultConfig {
        applicationId "com.peng.launcher"
        minSdk 14
        targetSdk 35
        versionCode 1
        versionName "0.1.0"
    }

    signingConfigs {
        release {
            storeFile rootProject.file("def_sign.jks")
            storePassword pengStorePassword
            keyAlias "penglauncher"
            keyPassword pengKeyPassword
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
        }
    }
}

def appVersionName = android.defaultConfig.versionName

androidComponents {
    onVariants(selector().all()) { variant ->
        variant.outputs.forEach { output ->
            output.outputFileName.set(
                    "PENG-Launcher-v${appVersionName}-${variant.name}.apk")
        }
    }
}
