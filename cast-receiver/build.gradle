plugins {
    id "com.android.application"
}

def appConfig = rootProject.ext.pengTv.apps.castReceiver
def embeddedSenderAssetsDir = file("$buildDir/generated/embedded-sender-assets")

android {
    namespace "com.peng.cast.receiver"
    compileSdk rootProject.ext.pengTv.compileSdk

    defaultConfig {
        applicationId appConfig.applicationId
        minSdk appConfig.minSdk
        targetSdk appConfig.targetSdk
        versionCode appConfig.versionCode
        versionName appConfig.versionName
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    sourceSets {
        main {
            assets.srcDir embeddedSenderAssetsDir
        }
    }
}

tasks.register("copyEmbeddedSenderApk", Copy) {
    dependsOn(":cast-sender:assembleDebug")
    from(project(":cast-sender").file("build/outputs/apk/debug/cast-sender-debug.apk"))
    into(embeddedSenderAssetsDir)
    rename { "peng-cast-sender.apk" }
}

tasks.named("preBuild").configure {
    dependsOn(tasks.named("copyEmbeddedSenderApk"))
}

dependencies {
    implementation project(":cast-protocol")
    implementation "androidx.core:core:1.9.0"
    implementation "com.google.zxing:core:3.5.1"
}
